<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="galBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#493B4C"/>
      <stop offset="100%" stop-color="#302633"/>
    </linearGradient>
    <linearGradient id="libGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B77A"/>
      <stop offset="100%" stop-color="#9E7F42"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#galBg)"/>

  <!-- Classical Archway Colonnade -->
  <g stroke="url(#libGold)" stroke-width="2.5" fill="none">
    <path d="M70 330 L70 170 Q130 110 190 170 L190 330"/>
    <path d="M210 330 L210 170 Q270 110 330 170 L330 330"/>
    <path d="M350 330 L350 170 Q410 110 470 170 L470 330"/>
  </g>

  <!-- Bookshelf Elements in Archways -->
  <rect x="85" y="200" width="90" height="10" fill="#D6B77A"/>
  <rect x="85" y="240" width="90" height="10" fill="#D6B77A"/>
  <rect x="85" y="280" width="90" height="10" fill="#D6B77A"/>
  <rect x="225" y="200" width="90" height="10" fill="#D6B77A"/>
  <rect x="225" y="240" width="90" height="10" fill="#D6B77A"/>
  <rect x="225" y="280" width="90" height="10" fill="#D6B77A"/>
  <rect x="365" y="200" width="90" height="10" fill="#D6B77A"/>
  <rect x="365" y="240" width="90" height="10" fill="#D6B77A"/>
  <rect x="365" y="280" width="90" height="10" fill="#D6B77A"/>

  <!-- Floor Horizon Line -->
  <line x1="40" y1="330" x2="560" y2="330" stroke="#D6B77A" stroke-width="4"/>

  <text x="300" y="55" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="700" fill="#D6B77A" text-anchor="middle" letter-spacing="2">CENTRAL DIGITAL &amp; REFERENCE LIBRARY</text>
  <text x="300" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#F7F3E9" text-anchor="middle" letter-spacing="1">10,000+ VOLUMES &amp; NATIONAL JOURNAL REPOSITORIES</text>
  <text x="300" y="370" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B9A8D8" text-anchor="middle">MAIN CAMPUS • RAVIPADU ROAD • NARASARAOPET</text>
</svg>
