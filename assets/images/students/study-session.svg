<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="studyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526B54"/>
      <stop offset="100%" stop-color="#344836"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#studyBg)"/>

  <!-- Warm Reading Lamp Glow -->
  <g transform="translate(480, 100)">
    <path d="M0 0 L-60 120 L60 120 Z" fill="#FFF3D6" opacity="0.2"/>
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#D6B77A"/>
  </g>

  <!-- Study Pod Table -->
  <rect x="80" y="240" width="440" height="20" rx="4" fill="#D6B77A"/>
  <rect x="110" y="260" width="15" height="100" fill="#493B4C"/>
  <rect x="475" y="260" width="15" height="100" fill="#493B4C"/>

  <!-- Books Stacked on Table -->
  <rect x="140" y="215" width="85" height="12" rx="2" fill="#E9A18C"/>
  <rect x="135" y="227" width="95" height="13" rx="2" fill="#B9A8D8"/>
  <rect x="150" y="200" width="70" height="15" rx="2" fill="#D6B77A"/>
  
  <!-- Open Textbook in Front of Scholar -->
  <polygon points="260,238 340,238 355,225 245,225" fill="#F7F3E9"/>
  <line x1="300" y1="225" x2="300" y2="238" stroke="#493B4C" stroke-width="2"/>

  <!-- Student Silhouette in Deep Concentration -->
  <circle cx="300" cy="140" r="32" fill="#F7F3E9" opacity="0.9"/>
  <path d="M260 215 C260 175, 340 175, 340 215 Z" fill="#F7F3E9" opacity="0.85"/>

  <text x="300" y="55" font-family="'Cinzel', 'Playfair Display', serif" font-size="22" font-weight="700" fill="#D6B77A" text-anchor="middle" letter-spacing="2">SUPER-60 EVENING PROBLEM-SOLVING PODS</text>
  <text x="300" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#F7F3E9" text-anchor="middle" letter-spacing="1">DEDICATED 1:1 DOUBT RESOLUTION &amp; ERROR-LOG REVISION</text>
  <text x="300" y="380" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D6B77A" text-anchor="middle">BALAJI BHAVAN (BOYS) &amp; YASHODA BHAVAN (GIRLS)</text>
</svg>
