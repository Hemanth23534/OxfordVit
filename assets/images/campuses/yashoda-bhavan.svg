<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="yashodaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F2432"/>
      <stop offset="40%" stop-color="#6A566E"/>
      <stop offset="80%" stop-color="#B9A8D8"/>
      <stop offset="100%" stop-color="#F7F3E9"/>
    </linearGradient>
    <linearGradient id="yashodaBldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="50%" stop-color="#F2EAF7"/>
      <stop offset="100%" stop-color="#B9A8D8"/>
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#E9A18C"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#yashodaSky)"/>

  <!-- Elegant Secure Residential Complex -->
  <rect x="150" y="150" width="500" height="250" rx="8" fill="url(#yashodaBldg)" stroke="#B9A8D8" stroke-width="2"/>

  <!-- Decorative Arched Balconies & Windows -->
  <g fill="url(#roseGlow)">
    <!-- Top Floor Arched Windows -->
    <path d="M 190 220 L 190 190 A 20 20 0 0 1 230 190 L 230 220 Z"/>
    <path d="M 260 220 L 260 190 A 20 20 0 0 1 300 190 L 300 220 Z"/>
    <path d="M 330 220 L 330 190 A 20 20 0 0 1 370 190 L 370 220 Z"/>
    <path d="M 430 220 L 430 190 A 20 20 0 0 1 470 190 L 470 220 Z"/>
    <path d="M 500 220 L 500 190 A 20 20 0 0 1 540 190 L 540 220 Z"/>
    <path d="M 570 220 L 570 190 A 20 20 0 0 1 610 190 L 610 220 Z"/>

    <!-- Middle Floor Windows -->
    <rect x="190" y="250" width="40" height="40" rx="4"/>
    <rect x="260" y="250" width="40" height="40" rx="4"/>
    <rect x="330" y="250" width="40" height="40" rx="4"/>
    <rect x="430" y="250" width="40" height="40" rx="4"/>
    <rect x="500" y="250" width="40" height="40" rx="4"/>
    <rect x="570" y="250" width="40" height="40" rx="4"/>

    <!-- Ground Floor -->
    <rect x="190" y="320" width="40" height="40" rx="4"/>
    <rect x="260" y="320" width="40" height="40" rx="4"/>
    <rect x="330" y="320" width="40" height="40" rx="4"/>
    <rect x="430" y="320" width="40" height="40" rx="4"/>
    <rect x="500" y="320" width="40" height="40" rx="4"/>
    <rect x="570" y="320" width="40" height="40" rx="4"/>
  </g>

  <!-- Central Glass Canopy Entrance -->
  <path d="M 380 400 L 380 290 A 20 20 0 0 1 420 290 L 420 400 Z" fill="#493B4C"/>
  <rect x="370" y="280" width="60" height="8" rx="4" fill="#D6B77A"/>

  <!-- Courtyard Gardens & Security Gate -->
  <rect x="0" y="390" width="800" height="110" fill="#374938"/>
  <circle cx="120" cy="390" r="35" fill="#526B54"/>
  <circle cx="160" cy="405" r="25" fill="#739075"/>
  <circle cx="680" cy="390" r="35" fill="#526B54"/>
  <circle cx="640" cy="405" r="25" fill="#739075"/>

  <!-- Ornamental Gate Grill in Gold -->
  <g stroke="#D6B77A" stroke-width="2">
    <line x1="80" y1="360" x2="720" y2="360"/>
    <line x1="100" y1="360" x2="100" y2="400"/>
    <line x1="140" y1="360" x2="140" y2="400"/>
    <line x1="660" y1="360" x2="660" y2="400"/>
    <line x1="700" y1="360" x2="700" y2="400"/>
  </g>

  <rect x="240" y="445" width="320" height="36" rx="18" fill="rgba(30, 22, 32, 0.85)" stroke="#B9A8D8"/>
  <text x="400" y="468" font-family="sans-serif" font-size="13" font-weight="600" fill="#FFF2D6" text-anchor="middle" letter-spacing="1">YASHODA BHAVAN • GIRLS RESIDENCE</text>
</svg>
