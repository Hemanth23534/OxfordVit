<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ksrSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1620"/>
      <stop offset="50%" stop-color="#2F2432"/>
      <stop offset="85%" stop-color="#493B4C"/>
      <stop offset="100%" stop-color="#D6B77A"/>
    </linearGradient>
    <linearGradient id="ksrGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B77A" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FAF7F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#493B4C" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ksrSky)"/>

  <!-- High-Rise Executive Headquarters Tower -->
  <rect x="280" y="80" width="240" height="320" rx="8" fill="url(#ksrGlass)" stroke="#D6B77A" stroke-width="2"/>

  <!-- Vertical Architectural Louvers in Gold -->
  <g stroke="#D6B77A" stroke-width="2">
    <line x1="310" y1="80" x2="310" y2="400"/>
    <line x1="340" y1="80" x2="340" y2="400"/>
    <line x1="370" y1="80" x2="370" y2="400"/>
    <line x1="400" y1="80" x2="400" y2="400" stroke-width="3" stroke="#FFF2D6"/>
    <line x1="430" y1="80" x2="430" y2="400"/>
    <line x1="460" y1="80" x2="460" y2="400"/>
    <line x1="490" y1="80" x2="490" y2="400"/>
  </g>

  <!-- Horizontal Floor Lines -->
  <g stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5">
    <line x1="280" y1="120" x2="520" y2="120"/>
    <line x1="280" y1="160" x2="520" y2="160"/>
    <line x1="280" y1="200" x2="520" y2="200"/>
    <line x1="280" y1="240" x2="520" y2="240"/>
    <line x1="280" y1="280" x2="520" y2="280"/>
    <line x1="280" y1="320" x2="520" y2="320"/>
    <line x1="280" y1="360" x2="520" y2="360"/>
  </g>

  <!-- Penthouse Directorate Crown & Trust Monogram -->
  <rect x="340" y="45" width="120" height="35" rx="4" fill="#493B4C" stroke="#D6B77A" stroke-width="2"/>
  <text x="400" y="68" font-family="serif" font-size="16" font-weight="bold" fill="#D6B77A" text-anchor="middle">KSR</text>

  <!-- Lower Flanking Wings -->
  <rect x="180" y="240" width="100" height="160" rx="4" fill="#3A2C3E" stroke="#D6B77A" stroke-width="1.5"/>
  <rect x="520" y="240" width="100" height="160" rx="4" fill="#3A2C3E" stroke="#D6B77A" stroke-width="1.5"/>

  <!-- Base Plaza & Lighting -->
  <rect x="0" y="400" width="800" height="100" fill="#1E1620"/>
  <rect x="0" y="400" width="800" height="6" fill="#D6B77A"/>

  <rect x="240" y="445" width="320" height="36" rx="18" fill="rgba(30, 22, 32, 0.9)" stroke="#D6B77A"/>
  <text x="400" y="468" font-family="sans-serif" font-size="13" font-weight="600" fill="#FFF2D6" text-anchor="middle" letter-spacing="1">KSR TOWERS • DIRECTORATE HEADQUARTERS</text>
</svg>
