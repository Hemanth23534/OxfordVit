<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyLavender" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBE3EE" />
      <stop offset="60%" stop-color="#F7F3E9" />
      <stop offset="100%" stop-color="#E2D9E6" />
    </linearGradient>
    <linearGradient id="facadeGirls" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#ECE3ED" />
    </linearGradient>
    <linearGradient id="lavenderTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B9A8D8" />
      <stop offset="50%" stop-color="#C7B8E4" />
      <stop offset="100%" stop-color="#A894C9" />
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6B77A" />
      <stop offset="100%" stop-color="#C29F5D" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#493B4C" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="500" fill="url(#skyLavender)" />
  <circle cx="350" cy="150" r="220" fill="#B9A8D8" opacity="0.25" filter="blur(45px)" />
  <circle cx="580" cy="180" r="160" fill="#D6B77A" opacity="0.18" filter="blur(40px)" />

  <!-- Courtyard & Ground Level -->
  <rect x="0" y="400" width="800" height="100" fill="#526B54" opacity="0.9" />
  <rect x="0" y="395" width="800" height="7" fill="url(#goldBanner)" />

  <!-- Vasavi Tower Architecture (Multistory Residential & Day Wing) -->
  <g filter="url(#softGlow)">
    <!-- Tower Main Body -->
    <rect x="230" y="80" width="340" height="320" rx="8" fill="url(#facadeGirls)" stroke="#B9A8D8" stroke-width="2" />
    
    <!-- Top Crown Balustrade -->
    <rect x="220" y="70" width="360" height="18" rx="4" fill="url(#lavenderTrim)" stroke="#493B4C" stroke-width="1" />
    
    <!-- Signage Bar -->
    <rect x="250" y="95" width="300" height="32" rx="4" fill="#493B4C" />
    <text x="400" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#FAF7F2" text-anchor="middle" letter-spacing="2">VASAVI TOWER GIRLS CAMPUS</text>
    <text x="400" y="123" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#D6B77A" text-anchor="middle" letter-spacing="1.5">OXFORD VIT • GUNTUR</text>

    <!-- Symmetric Rows of Elegant Windows / Balconies -->
    <!-- Floor 4 -->
    <g fill="#493B4C" opacity="0.8">
      <rect x="260" y="145" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
      <rect x="330" y="145" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
      <rect x="425" y="145" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
      <rect x="495" y="145" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
    </g>

    <!-- Floor 3 -->
    <g fill="#493B4C" opacity="0.8">
      <rect x="260" y="200" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
      <rect x="330" y="200" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
      <rect x="425" y="200" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
      <rect x="495" y="200" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
    </g>

    <!-- Floor 2 -->
    <g fill="#493B4C" opacity="0.8">
      <rect x="260" y="255" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
      <rect x="330" y="255" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
      <rect x="425" y="255" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
      <rect x="495" y="255" width="45" height="35" rx="3" fill="#D8CFE0" stroke="#B9A8D8" stroke-width="1.5" />
    </g>

    <!-- Ground Level Gated Entrance & Biometric Security Post -->
    <rect x="345" y="325" width="110" height="75" rx="4" fill="#FAF7F2" stroke="#B9A8D8" stroke-width="2" />
    <path d="M 370,400 L 370,350 Q 400,335 430,350 L 430,400 Z" fill="#493B4C" />
    <!-- Golden Security Crest -->
    <circle cx="400" cy="340" r="10" fill="url(#goldBanner)" />
    <polygon points="400,333 403,338 408,339 404,343 405,348 400,345 395,348 396,343 392,339 397,338" fill="#FAF7F2" />
  </g>

  <!-- Security Perimeter Gate -->
  <line x1="120" y1="400" x2="230" y2="400" stroke="#B9A8D8" stroke-width="3" />
  <line x1="570" y1="400" x2="680" y2="400" stroke="#B9A8D8" stroke-width="3" />

  <!-- Courtyard Flora / Flowering Shrubs -->
  <circle cx="160" cy="390" r="25" fill="#B9A8D8" opacity="0.8" />
  <circle cx="180" cy="395" r="18" fill="#D6B77A" opacity="0.8" />
  <circle cx="630" cy="390" r="22" fill="#B9A8D8" opacity="0.8" />
  <circle cx="650" cy="395" r="26" fill="#526B54" opacity="0.9" />

  <!-- Security Badge Overlay -->
  <g transform="translate(60, 130)">
    <rect width="140" height="36" rx="18" fill="#FAF8F5" stroke="#B9A8D8" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="70" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#493B4C" text-anchor="middle">24/7 GATED SECURITY</text>
  </g>
</svg>
