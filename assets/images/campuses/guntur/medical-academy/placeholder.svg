<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="50%" stop-color="#EFE9DC"/>
      <stop offset="100%" stop-color="#DFD7C5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#526B54"/>
      <stop offset="100%" stop-color="#E9A18C"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#grad)"/>

  <!-- Architectural Background Grid -->
  <g stroke="#526B54" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Central Crest Halo -->
  <circle cx="400" cy="210" r="120" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="400" cy="210" r="105" fill="none" stroke="#526B54" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>

  <!-- Classical Architectural Emblem -->
  <g transform="translate(400, 205)" fill="#E9A18C">
    <polygon points="-55,-35 0,-60 55,-35" fill="#526B54"/>
    <rect x="-55" y="-33" width="110" height="7" rx="2"/>
    <rect x="-45" y="-24" width="8" height="48" rx="1.5" fill="#526B54"/>
    <rect x="-20" y="-24" width="8" height="48" rx="1.5" fill="#526B54"/>
    <rect x="12" y="-24" width="8" height="48" rx="1.5" fill="#526B54"/>
    <rect x="37" y="-24" width="8" height="48" rx="1.5" fill="#526B54"/>
    <rect x="-60" y="24" width="120" height="10" rx="2"/>
    <rect x="-68" y="34" width="136" height="7" rx="2" fill="#526B54"/>
  </g>

  <!-- Top Pill: City Hub -->
  <g transform="translate(400, 75)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#E9A18C"/>
    <text x="0" y="4.5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">GUNTUR HUB</text>
  </g>

  <!-- Campus Title -->
  <text x="400" y="365" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="800" fill="#493B4C" text-anchor="middle" letter-spacing="1.5">VIT Medical Academy</text>
  
  <!-- Campus Badge / Focus -->
  <text x="400" y="396" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#E9A18C" text-anchor="middle" letter-spacing="1">Long-Term NEET Wing & Intensive Labs</text>
  
  <!-- Sub-label -->
  <text x="400" y="425" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="500" fill="#8C7E90" text-anchor="middle" letter-spacing="0.5">Oxford VIT Institutional Corridor • Where Knowledge Takes Shape</text>
</svg>