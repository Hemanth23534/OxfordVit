<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyCity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5DECE" />
      <stop offset="50%" stop-color="#F2EDE2" />
      <stop offset="100%" stop-color="#DFD7C7" />
    </linearGradient>
    <linearGradient id="towerGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7E1E9" />
      <stop offset="50%" stop-color="#C5D3DF" />
      <stop offset="100%" stop-color="#B2C5D3" />
    </linearGradient>
    <linearGradient id="towerFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#554258" />
      <stop offset="100%" stop-color="#3C2F3E" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6B77A" />
      <stop offset="50%" stop-color="#ECCF96" />
      <stop offset="100%" stop-color="#BA9854" />
    </linearGradient>
    <filter id="towerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#493B4C" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="500" fill="url(#skyCity)" />
  <circle cx="400" cy="160" r="240" fill="#D6B77A" opacity="0.15" filter="blur(50px)" />
  <circle cx="250" cy="180" r="180" fill="#B9A8D8" opacity="0.2" filter="blur(40px)" />

  <!-- Urban Ground Pavement -->
  <rect x="0" y="420" width="800" height="80" fill="#433746" />
  <rect x="0" y="415" width="800" height="8" fill="url(#goldAccent)" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#FAF8F5" stroke-dasharray="25, 20" stroke-width="2" />

  <!-- Background City Skyline Silhouette -->
  <rect x="80" y="280" width="100" height="140" fill="#C4B9AA" opacity="0.4" />
  <rect x="150" y="240" width="70" height="180" fill="#B7AA9A" opacity="0.4" />
  <rect x="580" y="260" width="85" height="160" fill="#C4B9AA" opacity="0.4" />
  <rect x="640" y="220" width="110" height="200" fill="#B7AA9A" opacity="0.4" />

  <!-- Balaji Tower Main High-Rise Structure (Guntur) -->
  <g filter="url(#towerShadow)">
    <!-- Main Tower Body -->
    <rect x="270" y="50" width="260" height="370" rx="8" fill="url(#towerFrame)" stroke="#D6B77A" stroke-width="2.5" />
    
    <!-- Central Glass Curtain Wall -->
    <rect x="295" y="110" width="210" height="260" rx="4" fill="url(#towerGlass)" stroke="#D6B77A" stroke-width="1.5" />

    <!-- Horizontal & Vertical Curtain Wall Mullions (Multistory grid) -->
    <!-- Floors -->
    <line x1="295" y1="150" x2="505" y2="150" stroke="#554258" stroke-width="2.5" />
    <line x1="295" y1="190" x2="505" y2="190" stroke="#554258" stroke-width="2.5" />
    <line x1="295" y1="230" x2="505" y2="230" stroke="#554258" stroke-width="2.5" />
    <line x1="295" y1="270" x2="505" y2="270" stroke="#554258" stroke-width="2.5" />
    <line x1="295" y1="310" x2="505" y2="310" stroke="#554258" stroke-width="2.5" />
    <line x1="295" y1="350" x2="505" y2="350" stroke="#554258" stroke-width="2.5" />

    <!-- Vertical Panels -->
    <line x1="345" y1="110" x2="345" y2="370" stroke="#554258" stroke-width="2" />
    <line x1="400" y1="110" x2="400" y2="370" stroke="#554258" stroke-width="2" />
    <line x1="455" y1="110" x2="455" y2="370" stroke="#554258" stroke-width="2" />

    <!-- Rooftop Architectural Crown & Communications Mast -->
    <polygon points="340,50 400,15 460,50" fill="url(#goldAccent)" />
    <line x1="400" y1="15" x2="400" y2="0" stroke="#D6B77A" stroke-width="3" />
    <circle cx="400" cy="2" r="3" fill="#E9A18C" />

    <!-- Top Signage Header -->
    <rect x="285" y="65" width="230" height="36" rx="4" fill="url(#goldAccent)" />
    <text x="400" y="81" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#3C2F3E" text-anchor="middle" letter-spacing="2">OXFORD VIT</text>
    <text x="400" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#3C2F3E" text-anchor="middle" letter-spacing="1.5">BALAJI TOWER • GUNTUR</text>

    <!-- Grand Ground Entrance Canopy -->
    <polygon points="260,380 540,380 520,390 280,390" fill="url(#goldAccent)" />
    <!-- Revolving / Glazed Entrance Doors -->
    <rect x="360" y="385" width="80" height="35" rx="3" fill="#FAF8F5" stroke="#D6B77A" stroke-width="1.5" />
    <line x1="400" y1="385" x2="400" y2="420" stroke="#493B4C" stroke-width="2" />
  </g>

  <!-- Competitive Focus Badges in Sky -->
  <g transform="translate(110, 110)">
    <rect width="130" height="30" rx="15" fill="#FAF8F5" stroke="#D6B77A" stroke-width="1.5" filter="url(#towerShadow)" />
    <text x="65" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#493B4C" text-anchor="middle">IIT-JEE ADVANCED</text>
  </g>

  <g transform="translate(560, 110)">
    <rect width="130" height="30" rx="15" fill="#FAF8F5" stroke="#526B54" stroke-width="1.5" filter="url(#towerShadow)" />
    <text x="65" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#526B54" text-anchor="middle">NEET MEDICAL HUB</text>
  </g>
</svg>
