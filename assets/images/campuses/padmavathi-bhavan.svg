<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="padmaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#493B4C"/>
      <stop offset="50%" stop-color="#739075"/>
      <stop offset="100%" stop-color="#F7F3E9"/>
    </linearGradient>
    <linearGradient id="padmaBldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="60%" stop-color="#EBE3D3"/>
      <stop offset="100%" stop-color="#D6B77A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#padmaSky)"/>

  <!-- Multi-Tiered Academic Learning Center -->
  <rect x="200" y="150" width="400" height="240" rx="6" fill="url(#padmaBldg)" stroke="#D6B77A" stroke-width="2"/>
  <rect x="250" y="110" width="300" height="40" rx="4" fill="#FAF7F0" stroke="#D6B77A" stroke-width="1.5"/>

  <!-- Windows Grid -->
  <g fill="#493B4C">
    <!-- Top floor -->
    <rect x="270" y="120" width="30" height="20" rx="2"/>
    <rect x="320" y="120" width="30" height="20" rx="2"/>
    <rect x="370" y="120" width="30" height="20" rx="2"/>
    <rect x="420" y="120" width="30" height="20" rx="2"/>
    <rect x="470" y="120" width="30" height="20" rx="2"/>

    <!-- Main floors -->
    <rect x="230" y="170" width="40" height="45" rx="3" fill="#D6B77A"/>
    <rect x="290" y="170" width="40" height="45" rx="3" fill="#D6B77A"/>
    <rect x="350" y="170" width="40" height="45" rx="3" fill="#D6B77A"/>
    <rect x="410" y="170" width="40" height="45" rx="3" fill="#D6B77A"/>
    <rect x="470" y="170" width="40" height="45" rx="3" fill="#D6B77A"/>
    <rect x="530" y="170" width="40" height="45" rx="3" fill="#D6B77A"/>

    <rect x="230" y="240" width="40" height="45" rx="3" fill="#FFF2D6"/>
    <rect x="290" y="240" width="40" height="45" rx="3" fill="#FFF2D6"/>
    <rect x="350" y="240" width="40" height="45" rx="3" fill="#FFF2D6"/>
    <rect x="410" y="240" width="40" height="45" rx="3" fill="#FFF2D6"/>
    <rect x="470" y="240" width="40" height="45" rx="3" fill="#FFF2D6"/>
    <rect x="530" y="240" width="40" height="45" rx="3" fill="#FFF2D6"/>

    <!-- Ground Floor -->
    <rect x="230" y="310" width="40" height="50" rx="3" fill="#493B4C"/>
    <rect x="290" y="310" width="40" height="50" rx="3" fill="#493B4C"/>
    <rect x="365" y="300" width="70" height="90" rx="35" fill="#526B54"/>
    <rect x="470" y="310" width="40" height="50" rx="3" fill="#493B4C"/>
    <rect x="530" y="310" width="40" height="50" rx="3" fill="#493B4C"/>
  </g>

  <!-- Ground Lawn -->
  <rect x="0" y="390" width="800" height="110" fill="#374938"/>
  <circle cx="150" cy="390" r="40" fill="#526B54"/>
  <circle cx="650" cy="390" r="40" fill="#526B54"/>

  <rect x="230" y="445" width="340" height="36" rx="18" fill="rgba(30, 22, 32, 0.85)" stroke="#D6B77A"/>
  <text x="400" y="468" font-family="sans-serif" font-size="13" font-weight="600" fill="#FFF2D6" text-anchor="middle" letter-spacing="1">PADMAVATHI BHAVAN • ACADEMIC RESIDENCE</text>
</svg>
