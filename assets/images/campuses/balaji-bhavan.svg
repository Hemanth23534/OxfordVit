<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="balajiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1620"/>
      <stop offset="45%" stop-color="#374938"/>
      <stop offset="80%" stop-color="#526B54"/>
      <stop offset="100%" stop-color="#D6B77A"/>
    </linearGradient>
    <linearGradient id="balajiBldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="60%" stop-color="#EBE3D3"/>
      <stop offset="100%" stop-color="#C2A46C"/>
    </linearGradient>
    <linearGradient id="studyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#D6B77A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#balajiSky)"/>
  
  <!-- Modern Residential Academic Complex -->
  <!-- Left Wing (Study Pods) -->
  <rect x="120" y="160" width="220" height="250" rx="6" fill="url(#balajiBldg)"/>
  <!-- Central Tower -->
  <rect x="310" y="110" width="180" height="300" rx="8" fill="#FAF7F0" stroke="#D6B77A" stroke-width="2"/>
  <!-- Right Wing (Residential Dorms) -->
  <rect x="460" y="160" width="220" height="250" rx="6" fill="url(#balajiBldg)"/>

  <!-- Rooftop Solar & Architectural Pergola -->
  <rect x="300" y="98" width="200" height="12" fill="#493B4C" rx="3"/>
  <line x1="330" y1="85" x2="470" y2="85" stroke="#D6B77A" stroke-width="4"/>
  <line x1="350" y1="85" x2="350" y2="98" stroke="#D6B77A" stroke-width="2"/>
  <line x1="400" y1="85" x2="400" y2="98" stroke="#D6B77A" stroke-width="2"/>
  <line x1="450" y1="85" x2="450" y2="98" stroke="#D6B77A" stroke-width="2"/>

  <!-- Super-60 Illuminated Window Grid -->
  <g fill="url(#studyGlow)">
    <!-- Central Tower Glass Atrium -->
    <rect x="345" y="140" width="110" height="40" rx="4"/>
    <rect x="345" y="195" width="110" height="40" rx="4"/>
    <rect x="345" y="250" width="110" height="40" rx="4"/>
    <rect x="345" y="305" width="110" height="40" rx="4"/>
    <rect x="370" y="360" width="60" height="50" rx="4" fill="#526B54"/>

    <!-- Left Wing Windows -->
    <rect x="150" y="190" width="35" height="30" rx="3"/>
    <rect x="200" y="190" width="35" height="30" rx="3"/>
    <rect x="250" y="190" width="35" height="30" rx="3"/>
    <rect x="150" y="240" width="35" height="30" rx="3"/>
    <rect x="200" y="240" width="35" height="30" rx="3"/>
    <rect x="250" y="240" width="35" height="30" rx="3"/>
    <rect x="150" y="290" width="35" height="30" rx="3"/>
    <rect x="200" y="290" width="35" height="30" rx="3"/>
    <rect x="250" y="290" width="35" height="30" rx="3"/>

    <!-- Right Wing Windows -->
    <rect x="515" y="190" width="35" height="30" rx="3"/>
    <rect x="565" y="190" width="35" height="30" rx="3"/>
    <rect x="615" y="190" width="35" height="30" rx="3"/>
    <rect x="515" y="240" width="35" height="30" rx="3"/>
    <rect x="565" y="240" width="35" height="30" rx="3"/>
    <rect x="615" y="240" width="35" height="30" rx="3"/>
    <rect x="515" y="290" width="35" height="30" rx="3"/>
    <rect x="565" y="290" width="35" height="30" rx="3"/>
    <rect x="615" y="290" width="35" height="30" rx="3"/>
  </g>

  <!-- Super-60 Emblematical Star Accent -->
  <circle cx="400" cy="125" r="10" fill="#D6B77A"/>
  <polygon points="400,118 403,124 409,125 404,129 406,135 400,131 394,135 396,129 391,124 397,118" fill="#1E1620"/>

  <!-- Foreground Landscaping & Ground -->
  <path d="M 0 400 Q 200 370 400 390 T 800 380 L 800 500 L 0 500 Z" fill="#374938"/>
  <rect x="0" y="420" width="800" height="80" fill="#243125"/>

  <!-- Badge Strip -->
  <rect x="230" y="445" width="340" height="36" rx="18" fill="rgba(30, 22, 32, 0.85)" stroke="#526B54"/>
  <text x="400" y="468" font-family="sans-serif" font-size="13" font-weight="600" fill="#FFF2D6" text-anchor="middle" letter-spacing="1">BALAJI BHAVAN • SUPER-60 RESIDENTIAL</text>
</svg>
