<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAE3D2" />
      <stop offset="60%" stop-color="#F7F3E9" />
      <stop offset="100%" stop-color="#E8E2D5" />
    </linearGradient>
    <linearGradient id="facadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#ECE5D8" />
    </linearGradient>
    <linearGradient id="goldRoof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6B77A" />
      <stop offset="50%" stop-color="#E5CA92" />
      <stop offset="100%" stop-color="#C29F5D" />
    </linearGradient>
    <linearGradient id="greenLawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67836A" />
      <stop offset="100%" stop-color="#445846" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#493B4C" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="500" fill="url(#skyGrad)" />

  <!-- Aurora Atmospheric Soft Glow -->
  <circle cx="200" cy="120" r="160" fill="#B9A8D8" opacity="0.22" filter="blur(40px)" />
  <circle cx="600" cy="140" r="180" fill="#E9A18C" opacity="0.2" filter="blur(40px)" />

  <!-- Campus Ground Lawn -->
  <rect x="0" y="380" width="800" height="120" fill="url(#greenLawn)" />
  <path d="M 0,380 Q 200,370 400,380 T 800,380 L 800,500 L 0,500 Z" fill="#526B54" opacity="0.4" />

  <!-- Main School Building Block -->
  <g filter="url(#softShadow)">
    <!-- Base Foundation -->
    <rect x="140" y="180" width="520" height="205" rx="10" fill="url(#facadeGrad)" stroke="#D6B77A" stroke-width="2" />
    
    <!-- Central Portico & Clock / Crest Tower -->
    <rect x="330" y="110" width="140" height="275" fill="#FAF8F5" stroke="#D6B77A" stroke-width="2" />
    <!-- Classical Triangular Pediment -->
    <polygon points="320,110 400,45 480,110" fill="url(#goldRoof)" stroke="#C29F5D" stroke-width="2" />
    
    <!-- School Clock / Emblem -->
    <circle cx="400" cy="95" r="22" fill="#493B4C" stroke="#D6B77A" stroke-width="3" />
    <path d="M 400,82 L 400,95 L 410,95" stroke="#F7F3E9" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Arch Entrance -->
    <path d="M 365,385 L 365,280 Q 400,245 435,280 L 435,385 Z" fill="#493B4C" />
    <rect x="370" y="275" width="60" height="110" fill="#362939" opacity="0.9" />
    <!-- Classical Columns -->
    <rect x="345" y="250" width="14" height="135" fill="#E5CA92" />
    <rect x="441" y="250" width="14" height="135" fill="#E5CA92" />

    <!-- Left Wing Windows (Classes 6 to 8) -->
    <g fill="#493B4C" opacity="0.85">
      <rect x="175" y="215" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="235" y="215" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="175" y="295" width="38" height="55" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="235" y="295" width="38" height="55" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
    </g>

    <!-- Right Wing Windows (Classes 9, 10 & Science Labs) -->
    <g fill="#493B4C" opacity="0.85">
      <rect x="525" y="215" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="585" y="215" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="525" y="295" width="38" height="55" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="585" y="295" width="38" height="55" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
    </g>

    <!-- School Crest & Title Band -->
    <rect x="190" y="185" width="420" height="22" rx="4" fill="#493B4C" />
    <text x="400" y="201" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#D6B77A" text-anchor="middle" letter-spacing="3">OXFORD IIT CONCEPT SCHOOL • FOUNDATION WING</text>
  </g>

  <!-- Trees & Campus Landscaping -->
  <ellipse cx="90" cy="370" rx="35" ry="55" fill="#526B54" />
  <ellipse cx="120" cy="380" rx="25" ry="40" fill="#67836A" />
  <rect x="86" y="380" width="8" height="30" fill="#493B4C" />

  <ellipse cx="710" cy="370" rx="40" ry="60" fill="#526B54" />
  <ellipse cx="675" cy="385" rx="28" ry="42" fill="#67836A" />
  <rect x="706" y="380" width="8" height="30" fill="#493B4C" />

  <!-- School Bus in Distance (Yellow Fleet) -->
  <g transform="translate(620, 410) scale(0.65)">
    <rect x="0" y="0" width="120" height="45" rx="8" fill="#F4B41A" stroke="#493B4C" stroke-width="2" />
    <rect x="10" y="8" width="20" height="16" rx="2" fill="#F7F3E9" stroke="#493B4C" />
    <rect x="35" y="8" width="20" height="16" rx="2" fill="#F7F3E9" stroke="#493B4C" />
    <rect x="60" y="8" width="20" height="16" rx="2" fill="#F7F3E9" stroke="#493B4C" />
    <rect x="85" y="8" width="25" height="16" rx="2" fill="#F7F3E9" stroke="#493B4C" />
    <circle cx="25" cy="45" r="10" fill="#493B4C" />
    <circle cx="95" cy="45" r="10" fill="#493B4C" />
    <text x="50" y="36" font-family="sans-serif" font-size="7" font-weight="bold" fill="#493B4C">OXFORD VIT</text>
  </g>
</svg>
