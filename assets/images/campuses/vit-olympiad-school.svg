<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGradOly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAE3D2" />
      <stop offset="60%" stop-color="#F7F3E9" />
      <stop offset="100%" stop-color="#E8E2D5" />
    </linearGradient>
    <linearGradient id="facadeOly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#ECE5D8" />
    </linearGradient>
    <linearGradient id="goldOly" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6B77A" />
      <stop offset="50%" stop-color="#E5CA92" />
      <stop offset="100%" stop-color="#C29F5D" />
    </linearGradient>
    <linearGradient id="lawnOly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E7861" />
      <stop offset="100%" stop-color="#3C4F3E" />
    </linearGradient>
    <filter id="softShadowOly" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#493B4C" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="500" fill="url(#skyGradOly)" />

  <!-- Aurora Atmosphere -->
  <circle cx="220" cy="110" r="160" fill="#B9A8D8" opacity="0.25" filter="blur(45px)" />
  <circle cx="580" cy="130" r="170" fill="#D6B77A" opacity="0.2" filter="blur(40px)" />

  <!-- Ground Lawn -->
  <rect x="0" y="380" width="800" height="120" fill="url(#lawnOly)" />
  <path d="M 0,380 Q 200,370 400,380 T 800,380 L 800,500 L 0,500 Z" fill="#526B54" opacity="0.35" />

  <!-- Main Olympiad School Building -->
  <g filter="url(#softShadowOly)">
    <!-- Base Structure -->
    <rect x="130" y="175" width="540" height="210" rx="10" fill="url(#facadeOly)" stroke="#D6B77A" stroke-width="2" />
    
    <!-- Central Observatory / Olympiad Tower -->
    <rect x="330" y="95" width="140" height="290" fill="#FAF8F5" stroke="#D6B77A" stroke-width="2" />
    <!-- Classical Triangular Pediment -->
    <polygon points="315,95 400,35 485,95" fill="url(#goldOly)" stroke="#C29F5D" stroke-width="2" />
    
    <!-- Olympiad Atom / Mathematical Compass Symbol -->
    <circle cx="400" cy="78" r="22" fill="#493B4C" stroke="#D6B77A" stroke-width="3" />
    <path d="M 390,78 L 410,78 M 400,68 L 400,88" stroke="#D6B77A" stroke-width="2" />
    <circle cx="400" cy="78" r="14" fill="none" stroke="#F7F3E9" stroke-width="1.5" stroke-dasharray="3 2" />
    
    <!-- Entrance Archway -->
    <path d="M 365,385 L 365,275 Q 400,240 435,275 L 435,385 Z" fill="#493B4C" />
    <!-- Doric Columns -->
    <rect x="345" y="245" width="14" height="140" fill="#E5CA92" />
    <rect x="441" y="245" width="14" height="140" fill="#E5CA92" />

    <!-- Classrooms Left Wing -->
    <g fill="#493B4C" opacity="0.85">
      <rect x="165" y="210" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="220" y="210" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="275" y="210" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="165" y="280" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="220" y="280" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="275" y="280" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
    </g>

    <!-- Classrooms Right Wing -->
    <g fill="#493B4C" opacity="0.85">
      <rect x="490" y="210" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="545" y="210" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="600" y="210" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="490" y="280" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="545" y="280" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
      <rect x="600" y="280" width="38" height="45" rx="4" fill="#D2C7B8" stroke="#D6B77A" stroke-width="1.5" />
    </g>
  </g>

  <!-- Landscaping Trees -->
  <g fill="#4E6750">
    <circle cx="85" cy="360" r="38" />
    <circle cx="105" cy="340" r="30" />
    <rect x="90" y="360" width="8" height="35" fill="#423126" />
    
    <circle cx="715" cy="360" r="38" />
    <circle cx="695" cy="340" r="30" />
    <rect x="702" y="360" width="8" height="35" fill="#423126" />
  </g>

  <!-- Signboard Plaque -->
  <rect x="230" y="420" width="340" height="44" rx="8" fill="#493B4C" stroke="#D6B77A" stroke-width="1.5" />
  <text x="400" y="442" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#D6B77A" text-anchor="middle" letter-spacing="1.5">VIT OLYMPIAD SCHOOL</text>
  <text x="400" y="456" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#F7F3E9" text-anchor="middle" opacity="0.85">OLD SAMITHI OFFICE ROAD • RAMIREDDYPET • NARASARAOPET</text>
</svg>