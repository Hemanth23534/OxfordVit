<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bipcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374938"/>
      <stop offset="60%" stop-color="#243125"/>
      <stop offset="100%" stop-color="#1E1620"/>
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#739075"/>
      <stop offset="50%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#526B54"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bipcGrad)"/>

  <!-- Glowing DNA Double Helix Spiral -->
  <g stroke="#D6B77A" stroke-width="2.5" fill="none">
    <path d="M 60 70 Q 110 30 160 70 T 260 70 T 360 70"/>
    <path d="M 60 150 Q 110 190 160 150 T 260 150 T 360 150" stroke="#739075"/>
  </g>

  <!-- Hydrogen Base Pair Rungs -->
  <g stroke="#FFF2D6" stroke-width="1.8">
    <line x1="85" y1="52" x2="85" y2="168"/>
    <line x1="110" y1="42" x2="110" y2="178"/>
    <line x1="135" y1="52" x2="135" y2="168"/>
    <line x1="185" y1="88" x2="185" y2="132"/>
    <line x1="210" y1="98" x2="210" y2="122"/>
    <line x1="235" y1="88" x2="235" y2="132"/>
    <line x1="285" y1="52" x2="285" y2="168"/>
    <line x1="310" y1="42" x2="310" y2="178"/>
    <line x1="335" y1="52" x2="335" y2="168"/>
  </g>

  <!-- Base Pair Nodes -->
  <g fill="#D6B77A">
    <circle cx="85" cy="52" r="4"/>
    <circle cx="110" cy="42" r="4"/>
    <circle cx="135" cy="52" r="4"/>
    <circle cx="285" cy="52" r="4"/>
    <circle cx="310" cy="42" r="4"/>
    <circle cx="335" cy="52" r="4"/>
  </g>
  <g fill="#739075">
    <circle cx="85" cy="168" r="4"/>
    <circle cx="110" cy="178" r="4"/>
    <circle cx="135" cy="168" r="4"/>
    <circle cx="285" cy="168" r="4"/>
    <circle cx="310" cy="178" r="4"/>
    <circle cx="335" cy="168" r="4"/>
  </g>

  <!-- Organic Benzene Molecular Ring -->
  <g transform="translate(60, 100)" stroke="#B9A8D8" stroke-width="2" fill="none">
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12"/>
    <circle cx="0" cy="0" r="14" stroke="#FFF2D6" stroke-width="1.2"/>
  </g>

  <text x="45" y="225" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#FFF2D6">BiPC: BIOLOGY • PHYSICS • CHEMISTRY</text>
</svg>
