<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="mpcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#493B4C"/>
      <stop offset="50%" stop-color="#2F2432"/>
      <stop offset="100%" stop-color="#1E1620"/>
    </linearGradient>
    <linearGradient id="goldCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6B77A"/>
      <stop offset="50%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#E9A18C"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#mpcGrad)"/>

  <!-- Coordinate Grid Lines -->
  <g stroke="rgba(214, 183, 122, 0.15)" stroke-width="1">
    <line x1="50" y1="40" x2="50" y2="200"/>
    <line x1="100" y1="40" x2="100" y2="200"/>
    <line x1="150" y1="40" x2="150" y2="200"/>
    <line x1="200" y1="40" x2="200" y2="200"/>
    <line x1="250" y1="40" x2="250" y2="200"/>
    <line x1="300" y1="40" x2="300" y2="200"/>
    <line x1="350" y1="40" x2="350" y2="200"/>
    
    <line x1="30" y1="60" x2="370" y2="60"/>
    <line x1="30" y1="100" x2="370" y2="100"/>
    <line x1="30" y1="140" x2="370" y2="140"/>
    <line x1="30" y1="180" x2="370" y2="180"/>
  </g>

  <!-- Primary Axes with Arrows -->
  <line x1="40" y1="140" x2="360" y2="140" stroke="#D6B77A" stroke-width="2"/>
  <polygon points="365,140 355,135 355,145" fill="#D6B77A"/>
  <line x1="80" y1="210" x2="80" y2="30" stroke="#D6B77A" stroke-width="2"/>
  <polygon points="80,25 75,35 85,35" fill="#D6B77A"/>

  <!-- Calculus Sinusoidal & Exponential Function Curves -->
  <path d="M 80 140 Q 150 40 220 140 T 360 140" fill="none" stroke="url(#goldCurve)" stroke-width="3.5"/>
  <path d="M 80 190 Q 180 170 260 70" fill="none" stroke="#E9A18C" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- 3D Geometric Dodecahedron / Polyhedron Accent -->
  <g transform="translate(300, 75)" stroke="#D6B77A" stroke-width="1.8" fill="rgba(214, 183, 122, 0.15)">
    <polygon points="0,-35 30,-15 30,20 0,35 -30,20 -30,-15"/>
    <line x1="0" y1="-35" x2="0" y2="10"/>
    <line x1="30" y1="-15" x2="0" y2="10"/>
    <line x1="-30" y1="-15" x2="0" y2="10"/>
    <line x1="30" y1="20" x2="0" y2="35"/>
    <line x1="-30" y1="20" x2="0" y2="35"/>
  </g>

  <!-- Mathematical Formula Badges -->
  <text x="95" y="55" font-family="serif" font-size="16" font-style="italic" fill="#FFF2D6">∫ f(x) dx</text>
  <text x="210" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D6B77A">∇ × B = μ₀J</text>
  <text x="45" y="225" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#FFF2D6">MPC: MATHEMATICS • PHYSICS • CHEMISTRY</text>
</svg>
