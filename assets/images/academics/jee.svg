<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="jeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1620"/>
      <stop offset="50%" stop-color="#2F2432"/>
      <stop offset="100%" stop-color="#493B4C"/>
    </linearGradient>
    <linearGradient id="orbitGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A68749"/>
      <stop offset="50%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#D6B77A"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#jeeGrad)"/>

  <!-- Quantum Atomic Nucleus & Orbital Shells -->
  <g transform="translate(200, 105)">
    <!-- Central Luminous Core -->
    <circle cx="0" cy="0" r="16" fill="url(#orbitGold)"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#FFF2D6" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Elliptical Quantum Orbit 1 -->
    <ellipse cx="0" cy="0" rx="110" ry="38" fill="none" stroke="#D6B77A" stroke-width="2" transform="rotate(-30)"/>
    <!-- Electron 1 -->
    <circle cx="85" cy="-28" r="5" fill="#E9A18C"/>

    <!-- Elliptical Quantum Orbit 2 -->
    <ellipse cx="0" cy="0" rx="110" ry="38" fill="none" stroke="#B9A8D8" stroke-width="2" transform="rotate(30)"/>
    <!-- Electron 2 -->
    <circle cx="-85" cy="-28" r="5" fill="#FFF2D6"/>

    <!-- Elliptical Quantum Orbit 3 -->
    <ellipse cx="0" cy="0" rx="110" ry="38" fill="none" stroke="#526B54" stroke-width="2" transform="rotate(90)"/>
    <!-- Electron 3 -->
    <circle cx="0" cy="95" r="5" fill="#D6B77A"/>
  </g>

  <!-- Super-60 Crest Badge -->
  <rect x="25" y="25" width="110" height="28" rx="14" fill="rgba(214, 183, 122, 0.2)" stroke="#D6B77A"/>
  <text x="80" y="44" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF2D6" text-anchor="middle">SUPER-60</text>

  <text x="45" y="225" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#FFF2D6">JEE MAIN & ADVANCED • NATIONAL IIT TRACK</text>
</svg>
