  <line x1="260" y1="95" x2="295" y2="125" stroke="#FFF2D6" stroke-width="2"/>
  <polygon points="298,128 295,118 288,124" fill="#FFF2D6"/>

  <!-- Golden State Laurel Medallion -->
  <g transform="translate(200, 140)">
    <circle cx="0" cy="0" r="26" fill="#493B4C" stroke="#D6B77A" stroke-width="2"/>
    <text x="0" y="6" font-family="sans-serif" font-size="14" font-weight="900" fill="#D6B77A" text-anchor="middle">TOP 100</text>
  </g>

  <text x="45" y="225" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#FFF2D6">AP EAPCET • ENGINEERING & AGRICULTURE</text>
