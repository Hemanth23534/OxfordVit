      <stop offset="0%" stop-color="#374938"/>
      <stop offset="50%" stop-color="#526B54"/>
      <stop offset="100%" stop-color="#2F2432"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#eapcetGrad)"/>

  <!-- Kinematics Trajectory Curve -->
