  <line x1="120" y1="100" x2="155" y2="70" stroke="#FFF2D6" stroke-width="2"/>
  <polygon points="158,67 148,70 152,78" fill="#FFF2D6"/>

  <line x1="200" y1="65" x2="245" y2="65" stroke="#FFF2D6" stroke-width="2"/>
