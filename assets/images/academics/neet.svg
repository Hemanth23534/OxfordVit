<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="neetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#493B4C"/>
      <stop offset="50%" stop-color="#3A2C3E"/>
      <stop offset="100%" stop-color="#2F2432"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#neetGrad)"/>

  <!-- Medical Cross Glow -->
  <g fill="rgba(233, 161, 140, 0.15)">
    <rect x="180" y="45" width="40" height="120" rx="6"/>
    <rect x="140" y="85" width="120" height="40" rx="6"/>
  </g>

  <!-- ECG Heart Rhythm Pulse Wave -->
  <path d="M 40 105 L 120 105 L 135 75 L 150 135 L 165 45 L 180 155 L 195 95 L 210 115 L 225 105 L 360 105" fill="none" stroke="#E9A18C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stethoscope Outline Art -->
  <g stroke="#D6B77A" stroke-width="2.5" fill="none">
    <path d="M 80 55 C 80 115 130 165 200 165 C 270 165 320 115 320 55"/>
    <line x1="200" y1="165" x2="200" y2="185"/>
    <circle cx="200" cy="192" r="12" fill="#FAF7F0" stroke="#D6B77A" stroke-width="2"/>
  </g>

  <!-- AIIMS Badge -->
  <rect x="25" y="25" width="90" height="28" rx="14" fill="rgba(233, 161, 140, 0.2)" stroke="#E9A18C"/>
  <text x="70" y="44" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF2D6" text-anchor="middle">AIIMS 360</text>

  <text x="45" y="225" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#FFF2D6">NEET MEDICAL ACADEMY • MBBS DISTINCTION</text>
</svg>
