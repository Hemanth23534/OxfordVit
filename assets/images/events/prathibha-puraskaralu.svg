<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="awardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#493B4C"/>
      <stop offset="50%" stop-color="#2D232F"/>
      <stop offset="100%" stop-color="#526B54"/>
    </linearGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="50%" stop-color="#D6B77A"/>
      <stop offset="100%" stop-color="#9C7836"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#awardBg)"/>
  
  <!-- Laurel Wreath Around Center -->
  <g transform="translate(300, 180)" stroke="url(#goldTrophy)" stroke-width="2.5" fill="none">
    <path d="M-100 20 C-120 -60, -60 -120, 0 -130"/>
    <path d="M100 20 C120 -60, 60 -120, 0 -130"/>
    <!-- Leaves Left -->
    <path d="M-85 -20 Q-105 -25 -95 -45 Q-75 -35 -85 -20" fill="url(#goldTrophy)"/>
    <path d="M-70 -60 Q-90 -70 -75 -90 Q-60 -75 -70 -60" fill="url(#goldTrophy)"/>
    <path d="M-40 -100 Q-55 -115 -35 -125 Q-25 -105 -40 -100" fill="url(#goldTrophy)"/>
    <!-- Leaves Right -->
    <path d="M85 -20 Q105 -25 95 -45 Q75 -35 85 -20" fill="url(#goldTrophy)"/>
    <path d="M70 -60 Q90 -70 75 -90 Q60 -75 70 -60" fill="url(#goldTrophy)"/>
    <path d="M40 -100 Q55 -115 35 -125 Q25 -105 40 -100" fill="url(#goldTrophy)"/>
  </g>

  <!-- Central Gold Medallion Trophy -->
  <circle cx="300" cy="180" r="60" fill="url(#goldTrophy)" stroke="#FFF" stroke-width="3"/>
  <circle cx="300" cy="180" r="50" fill="none" stroke="#493B4C" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="300,145 312,170 338,172 318,190 324,215 300,200 276,215 282,190 262,172 288,170" fill="#493B4C"/>

  <!-- Pedestal -->
  <rect x="240" y="270" width="120" height="25" rx="4" fill="url(#goldTrophy)"/>
  <rect x="220" y="295" width="160" height="30" rx="6" fill="#D6B77A"/>

  <text x="300" y="55" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="700" fill="#D6B77A" text-anchor="middle" letter-spacing="2">PRATHIBHA PURASKARALU</text>
  <text x="300" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#F7F3E9" text-anchor="middle" letter-spacing="1">ANNUAL RANKERS CONVOCATION &amp; KSR TRUST ENDOWMENTS</text>
  <text x="300" y="370" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#D6B77A" text-anchor="middle">HONORING JEE • NEET • AP EAPCET • IPE TOPPERS</text>
</svg>
