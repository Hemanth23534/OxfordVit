<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sankrantiSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9A18C"/>
      <stop offset="60%" stop-color="#F7F3E9"/>
      <stop offset="100%" stop-color="#D6B77A"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B77A"/>
      <stop offset="100%" stop-color="#8C5C2E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#sankrantiSky)"/>
  
  <!-- Sun Rays -->
  <circle cx="300" cy="180" r="140" fill="none" stroke="#D6B77A" stroke-width="2" stroke-dasharray="12 8" opacity="0.4"/>
  <circle cx="300" cy="180" r="110" fill="#F7F3E9" opacity="0.8"/>
  <circle cx="300" cy="180" r="85" fill="#D6B77A" opacity="0.9"/>
  
  <!-- Festive Kites in the Sky -->
  <polygon points="120,70 145,95 120,120 95,95" fill="#E9A18C"/>
  <path d="M120 120 Q110 150 130 170" fill="none" stroke="#493B4C" stroke-width="1.5"/>
  
  <polygon points="460,90 490,120 460,150 430,120" fill="#526B54"/>
  <path d="M460 150 Q480 180 460 210" fill="none" stroke="#493B4C" stroke-width="1.5"/>

  <!-- Sugarcane Stalks Crossing -->
  <line x1="200" y1="360" x2="350" y2="120" stroke="#526B54" stroke-width="10" stroke-linecap="round"/>
  <line x1="400" y1="360" x2="250" y2="120" stroke="#526B54" stroke-width="10" stroke-linecap="round"/>

  <!-- Traditional Earthen Pongal Pot with Frothing Milk -->
  <path d="M260 270 Q300 250 340 270 Q370 330 300 350 Q230 330 260 270 Z" fill="url(#potGrad)"/>
  <!-- Frothing Cream -->
  <ellipse cx="300" cy="270" rx="42" ry="14" fill="#FFFFFF"/>
  <circle cx="280" cy="265" r="8" fill="#FFFFFF"/>
  <circle cx="320" cy="266" r="7" fill="#FFFFFF"/>
  
  <!-- Rangoli Decorative Floor Border -->
  <path d="M60 370 Q100 340 140 370 T220 370 T300 370 T380 370 T460 370 T540 370" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
  
  <text x="300" y="55" font-family="'Cinzel', 'Playfair Display', serif" font-size="22" font-weight="700" fill="#493B4C" text-anchor="middle" letter-spacing="2">SANKRANTI SAMBARALU</text>
  <text x="300" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#526B54" text-anchor="middle" letter-spacing="1">TELUGU CULTURAL UTSAV &amp; FESTIVAL OF HARVEST</text>
</svg>
